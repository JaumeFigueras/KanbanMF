# KanbanMF — Apache vhost.
#
# Single public entry point: https://kanban.example.com:443. Nothing else is
# reachable from the internet — the FastAPI backend listens on 127.0.0.1:8000
# only, PostgreSQL listens on localhost only, and there is no separate
# frontend process (the React app is a static build, served directly by
# Apache from frontend/dist). Port 80 exists solely to redirect to HTTPS and
# to answer the ACME HTTP-01 challenge for certificate renewal.
#
# Substitute kanban.example.com and the /home/kanbanmf/... paths below for
# your own before enabling this site.
#
# Required modules (enable once):
#   a2enmod ssl proxy proxy_http proxy_wstunnel rewrite headers
#   a2ensite kanbanmf
#   systemctl reload apache2

<VirtualHost *:80>
    ServerName kanban.example.com

    # Let certbot answer the ACME challenge directly over :80 — this must
    # come before the blanket HTTPS redirect below, or renewal breaks.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName kanban.example.com
    Protocols h2 http/1.1

    # Built frontend (cd frontend && npm run build) — a static SPA, not a
    # running Node process.
    DocumentRoot /home/kanbanmf/KanbanMF/frontend/dist

    ErrorLog  ${APACHE_LOG_DIR}/kanbanmf-error.log
    CustomLog ${APACHE_LOG_DIR}/kanbanmf-access.log combined

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/kanban.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kanban.example.com/privkey.pem
    ServerSignature Off

    # At most 1 MiB per request body, refused with 413 before anything is
    # passed to the backend (Apache's own default is 1 GiB). The biggest
    # legitimate body is an avatar (100 KB). The backend refuses the same
    # size itself (src/core/body_limit.py); this one stops it at the door.
    LimitRequestBody 1048576

    # Security headers, on every response — the app, the API, errors
    # ("always"). Needs mod_headers.
    #
    # HSTS: browsers that have seen the site once only ever use HTTPS for it,
    # for a year, so nobody on the network can downgrade a later visit.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # No other site may show these pages in a frame: otherwise one could hide
    # the OAuth consent page under its own buttons and trick a user into
    # clicking Allow (clickjacking). X-Frame-Options for old browsers, CSP's
    # frame-ancestors (below) for current ones.
    Header always set X-Frame-Options "DENY"
    # Take a response's declared type as final: never run a file as script
    # because its content looks like one.
    Header always set X-Content-Type-Options "nosniff"
    # Addresses carry ids (boards, OAuth requests): don't hand them to other
    # sites through the Referer header.
    Header always set Referrer-Policy "same-origin"
    # Pages are only ever opened by navigation, never as another site's popup.
    Header always set Cross-Origin-Opener-Policy "same-origin"
    # The app needs none of these browser features.
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # What the page may load and run. Scripts only from this site — the built
    # app has no inline script and no eval, so an injected <script> or
    # onclick= can't run. Styles also inline, because MUI (Emotion) writes its
    # styles at run time. Images from this site and blob: (the avatar is
    # fetched with the access token and shown through a blob URL). Requests,
    # the WebSocket included, only to this site (wss:// spelled out for older
    # Safari). Nothing may frame the page, plugins are off, and <base> and form
    # targets can't be pointed elsewhere.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self' wss://kanban.example.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    <Directory /home/kanbanmf/KanbanMF/frontend/dist>
        Require all granted
        Options -Indexes

        # Everything that isn't a real static file falls back to index.html —
        # react-router-dom's BrowserRouter then handles the route
        # client-side. This is what makes a hard refresh on e.g.
        # /boards/<id> work instead of 404ing.
        #
        # This has to live inside <Directory>, not directly under
        # <VirtualHost>: per Apache's own docs, %{REQUEST_FILENAME} only
        # resolves to the real, translated filesystem path in per-directory
        # context. In per-server/vhost context it's just a copy of
        # REQUEST_URI, so `!-f` would (and did) evaluate true for every
        # request — including ones for files that exist — sending literally
        # everything through this fallback and serving index.html's content
        # for e.g. every *.js/*.css request too.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /index.html [L]
    </Directory>

    # index.html must never be cached — it's what points the browser at the
    # current content-hashed JS/CSS bundle. Those hashed bundle files, in
    # contrast, are safe to cache hard: a new build gets new filenames, so a
    # stale cached copy of one is never served under a name the new build
    # still uses.
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
    <FilesMatch "\.(js|css|svg|png|jpg|jpeg|webp|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>

    # The backend API, proxied to the loopback-only uvicorn process — most
    # specific ProxyPass wins regardless of declaration order, so the /ws
    # rule below only needs to exist for the websocket upgrade case. These
    # claim matching requests entirely before they'd ever reach the
    # <Directory> block above, so no extra "don't rewrite /api" guard is
    # needed there.
    ProxyPass        /api/v1/ws  ws://127.0.0.1:8000/api/v1/ws
    ProxyPassReverse /api/v1/ws  ws://127.0.0.1:8000/api/v1/ws

    ProxyPass        /api  http://127.0.0.1:8000/api
    ProxyPassReverse /api  http://127.0.0.1:8000/api

    # The MCP server Claude connects to, and the two OAuth discovery
    # documents it reads first (RFC 9728 and RFC 8414 fix their addresses at
    # the root of the site). Only these two under /.well-known: the rest of
    # it, such as certbot's acme-challenge, must not reach the backend.
    ProxyPass        /mcp  http://127.0.0.1:8000/mcp
    ProxyPassReverse /mcp  http://127.0.0.1:8000/mcp
    ProxyPass        /.well-known/oauth-protected-resource  http://127.0.0.1:8000/.well-known/oauth-protected-resource
    ProxyPass        /.well-known/oauth-authorization-server  http://127.0.0.1:8000/.well-known/oauth-authorization-server
</VirtualHost>
